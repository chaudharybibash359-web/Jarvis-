name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Info ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          # Detect active Java major version
          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          echo "Detected Java version string: $JAVA_VER_STRING"
          
          MAJOR_VERSION=$(echo "$JAVA_VER_STRING" | awk -F '.' '{print $1}')
          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Unable to detect Java major version."
            exit 1
          fi
          
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required. Found major version: $MAJOR_VERSION"
            exit 1
          fi
          echo "Java environment verified successfully (version >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Reusing existing debug keystore."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Searching app/build/outputs/apk for any generated APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: File does not have .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac

          echo "APK verified successfully:"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="$TEMP_DIR/app-debug.apk"

          cp "$SRC_APK" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_APK"
            exit 1
          fi

          echo "Release asset prepared at: $DEST_APK"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Environment ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK not found at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK is empty at $ASSET_PATH"
            exit 1
          fi

          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset filename must be exactly app-debug.apk, got $ASSET_NAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.

          - Run Number: ${{ github.run_number }}
          - Run Attempt: ${{ github.run_attempt }}
          - Source Commit: ${{ github.sha }}

          Notice:
          This APK is intended for testing and development only.
          It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH#app-debug.apk" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "=== RELEASE PUBLISHED SUCCESSFULLY ==="
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Asset: app-debug.apk"
            echo "Direct APK Download URL: $DIRECT_URL"
            echo "Actions backup artifact 'app-debug-apk' remains available."

            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The normal Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the backup Actions artifact 'app-debug-apk' remains available."
            fi
            echo "The latest direct release link may not be updated for this run."

            echo "### Build Status" >> "$GITHUB_STEP_SUMMARY"
            echo "Release publication failed or was skipped. However, if the APK build succeeded, the \`app-debug-apk\` Actions artifact remains available in the workflow summary." >> "$GITHUB_STEP_SUMMARY"
          fi
